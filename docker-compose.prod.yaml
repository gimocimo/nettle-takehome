# Production-shaped stack: gunicorn, the Next.js standalone server, non-root images,
# migrations as a one-off job before the app starts, no demo seed, secrets required.
# TLS terminates in front (load balancer / reverse proxy); for a plain-http local
# check set DJANGO_SECURE_SSL_REDIRECT=0 (secure cookies still need https to log in).
#
#   DJANGO_SECRET_KEY=... POSTGRES_PASSWORD=... APP_DB_PASSWORD=... ANTHROPIC_API_KEY=... \
#     docker compose -f docker-compose.prod.yaml up --build
#
# The app and the worker log in as nettle_app: not a superuser, can't bypass row-level
# security, and refused tenant data outside a tenant transaction (tenancy/rls.py).
# Only the migrate job and the internal admin use the owner role.
x-backend-environment: &backend-environment
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-1}
  DATABASE_URL: postgres://nettle_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/nettle
  CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000}
  CSRF_TRUSTED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000}
  FRONTEND_URL: ${FRONTEND_ORIGIN:-http://localhost:3000}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}

x-backend-image: &backend-image
  build:
    context: ./backend
    target: production
  environment: *backend-environment
  volumes:
    - media:/app/media

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: nettle
      POSTGRES_USER: nettle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nettle"]
      interval: 2s
      timeout: 5s
      retries: 15

  # One-off, as the owner: schema, customer configuration, and the app role's login,
  # before any app process starts.
  migrate:
    <<: *backend-image
    environment:
      <<: *backend-environment
      DATABASE_URL: postgres://nettle:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/nettle
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    command: >-
      sh -c "python manage.py migrate --noinput && python manage.py sync_config
      && python manage.py configure_app_role"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend-image
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend-image
    command: python manage.py run_worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Nettle staff's cross-tenant Django admin needs the owner role, so it is a separate
  # service, reachable only from the host here (in production: an internal network).
  admin:
    <<: *backend-image
    environment:
      <<: *backend-environment
      DATABASE_URL: postgres://nettle:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/nettle
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${API_ORIGIN:-http://localhost:8000}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
  media:
