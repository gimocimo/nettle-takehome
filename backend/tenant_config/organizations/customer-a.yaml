# An Italian insurer: COPE surveys only, reports written in Italian.
organization:
  slug: customer-a
  name: Customer A
  language: it-IT
  currency: EUR
  monthly_ai_budget_usd: 20
  ai_models: [claude-sonnet-5-5]

# The brief's "new customer": Industry is called Type, Sub-Industry is optional,
# and there is a Regulatory Body field.
client_fields:
  overrides:
    industry: {label: Type}
    sub_industry: {required: false}
  custom:
    - key: regulatory_body
      label: Regulatory Body
      type: text
      group: company
      show_in_list: true

report_templates:
  - key: property-cope-survey
    name: Property survey (COPE)
    sections: [executive-summary, site-and-exposure, construction, occupancy, fire-protection, natural-hazards, recommendations]
